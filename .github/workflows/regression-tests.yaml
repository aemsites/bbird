name: Regression Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Prevent multiple runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Clone regression tester repository
      run: git clone https://github.com/MarquiseRosier/regression-tester.git
      
    - name: Install regression tester dependencies
      run: |
        cd regression-tester
        # Check if package.json exists, if not, create a basic one
        if [ ! -f package.json ]; then
          echo '{"type": "module", "dependencies": {"dotenv": "^16.0.0", "yargs": "^17.0.0"}}' > package.json
        fi
        npm install
      
    - name: Extract URL from PR
      id: extract-url
      run: |
        # Get PR description and comments
        PR_BODY="${{ github.event.pull_request.body }}"
        PR_TITLE="${{ github.event.pull_request.title }}"
        
        # Search for --after tag in PR body and title
        URL=$(echo "$PR_BODY $PR_TITLE" | grep -o '--after [^[:space:]]*' | head -1 | sed 's/--after //')
        
        if [ -z "$URL" ]; then
          echo "No URL found with --after tag in PR description or title"
          echo "Please add a URL with --after tag in your PR description"
          exit 1
        fi
        
        echo "url=$URL" >> $GITHUB_OUTPUT
        echo "Extracted URL: $URL"
      
    - name: Run regression tests
      run: |
        cd regression-tester
        node index.js --url "${{ steps.extract-url.outputs.url }}" --metric cwv --device desktop
      env:
        NODE_ENV: test
        CI: true
      
    - name: Upload test results (if any)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: regression-test-results-${{ github.run_number }}
        path: |
          regression-tester/results/
          regression-tester/logs/
          regression-tester/output/
        retention-days: 7 